[package]
name = "betterreview"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
description = "Terminal code review for GitHub and GitLab"

[dependencies]
ansi-to-tui = "8.0.1"
async-trait = "0.1"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
percent-encoding = "2.3"
ratatui = "0.30.2"
rustix = { version = "1.1", features = ["process"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "=0.3.47", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-segmentation = "1.12"
unicode-width = "0.2.2"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
pretty_assertions = "1"
proptest = "1"
rstest = "0.26"

[profile.release]
codegen-units = 1
lto = true
strip = true
