name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DELTA_VERSION: "0.18.2"

jobs:
  quality:
    name: Formatação e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - name: Instalar delta (dependência dos testes de integração)
        run: |
          curl -sSLo /tmp/delta.deb "https://github.com/dandavison/delta/releases/download/${DELTA_VERSION}/git-delta_${DELTA_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/delta.deb
      - run: cargo test --workspace

  coverage:
    name: Cobertura de testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Instalar delta (dependência dos testes de integração)
        run: |
          curl -sSLo /tmp/delta.deb "https://github.com/dandavison/delta/releases/download/${DELTA_VERSION}/git-delta_${DELTA_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/delta.deb
      - name: Gerar relatório de cobertura
        run: |
          {
            echo "## Cobertura de testes"
            echo '```'
            cargo llvm-cov --workspace --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Versão e tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, test]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular próxima versão (conventional commits)
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          dry_run: true
          custom_release_rules: "fix:patch,perf:patch,refactor:patch,docs:patch,ci:patch,build:patch,test:patch,style:patch,chore:patch,feat:minor"
      - uses: taiki-e/install-action@v2
        if: steps.tag.outputs.new_tag != ''
        with:
          tool: git-cliff
      - name: Gravar versão, changelog, commit e tag
        if: steps.tag.outputs.new_tag != ''
        env:
          VERSION: ${{ steps.tag.outputs.new_version }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cargo update --workspace
          git-cliff --tag "${TAG}" -o CHANGELOG.md
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: release ${TAG}"
          git tag "${TAG}"
          git push origin main "refs/tags/${TAG}"

  build:
    name: Binário ${{ matrix.target }}
    if: needs.release.outputs.tag != ''
    needs: release
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Compilar release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Empacotar
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: tar -C "target/${{ matrix.target }}/release" -czf "betterreview-${TAG}-${{ matrix.target }}.tar.gz" betterreview
      - uses: actions/upload-artifact@v4
        with:
          name: betterreview-${{ matrix.target }}
          path: betterreview-*.tar.gz

  publish:
    name: Publicar release
    if: needs.release.outputs.tag != ''
    needs: [release, build]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Criar release no GitHub com notas do changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          git-cliff --latest --strip header -o /tmp/notes.md
          gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/notes.md artifacts/*.tar.gz
      - name: Atualizar formula no Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          SHA_ARM=$(sha256sum "artifacts/betterreview-${TAG}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          SHA_MAC=$(sha256sum "artifacts/betterreview-${TAG}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
          SHA_LINUX=$(sha256sum "artifacts/betterreview-${TAG}-x86_64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)
          BASE="https://github.com/juniorsantos/betterreview/releases/download/${TAG}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/juniorsantos/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/betterreview.rb <<FORMULA
          class Betterreview < Formula
            desc "Terminal code review for GitHub PRs and GitLab MRs"
            homepage "https://github.com/juniorsantos/betterreview"
            version "${VERSION}"
            license "MIT"

            depends_on "gh"
            depends_on "git-delta"
            depends_on "glab"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/betterreview-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "${BASE}/betterreview-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC}"
              end
            end

            on_linux do
              url "${BASE}/betterreview-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "betterreview"
            end

            def caveats
              <<~EOS
                Authenticate before the first review:
                  gh auth login    # GitHub
                  glab auth login  # GitLab
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/betterreview --version")
            end
          end
          FORMULA
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/betterreview.rb
          git diff --cached --quiet || git commit -m "betterreview ${VERSION}"
          git push origin HEAD
